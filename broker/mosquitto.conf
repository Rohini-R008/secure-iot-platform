# Single global security policy
per_listener_settings false

# Encrypted MQTT listener only — no plaintext port exists
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# Mutual TLS: every client MUST present a certificate signed by our CA,
# and the certificate's CN becomes the MQTT username (the device identity).
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

# No anonymous access, and authorization is driven by the ACL file
allow_anonymous false
acl_file /mosquitto/config/acl